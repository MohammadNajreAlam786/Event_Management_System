<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 386" width="1024" height="386">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#09101f" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <radialGradient id="accentOrb" cx="15%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="secOrb" cx="75%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Title Metallic Gradient -->
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="48%" stop-color="#e2e8f0" />
      <stop offset="52%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Electric Subtitle Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1428" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070c18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Mask to blend hero artwork left edge seamlessly into dark background -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <mask id="heroFadeMask">
      <rect x="490" y="0" width="534" height="386" fill="url(#maskGrad)" />
    </mask>
  </defs>

  <!-- 1. Canvas Base Background -->
  <rect width="1024" height="386" fill="url(#bgGrad)" />
  <circle cx="200" cy="120" r="340" fill="url(#accentOrb)" />
  <circle cx="850" cy="300" r="280" fill="url(#secOrb)" />

  <!-- Subtle Cyber Tech Grid Matrix -->
  <g stroke="#f43f5e" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="96" x2="1024" y2="96" />
    <line x1="0" y1="192" x2="1024" y2="192" />
    <line x1="0" y1="288" x2="1024" y2="288" />
    <line x1="256" y1="0" x2="256" y2="386" />
    <line x1="512" y1="0" x2="512" y2="386" />
    <line x1="768" y1="0" x2="768" y2="386" />
  </g>

  <!-- 2. Right Side Visual: Clean Photo Asset OR Procedural Vector Artwork -->
  <g transform="translate(560, 20)">
    <!-- Ambient Holographic Glow -->
    <circle cx="230" cy="170" r="160" fill="#f43f5e" opacity="0.12" filter="url(#glow)" />
    <circle cx="160" cy="200" r="120" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

    <!-- Isometric Tech Blueprint Grid -->
    <g stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.25" fill="none">
      <polygon points="220,40 370,120 370,260 220,180" />
      <polygon points="70,120 220,40 220,180 70,260" />
      <polygon points="220,180 370,260 220,340 70,260" />
      <!-- Central Core Rings -->
      <circle cx="220" cy="180" r="50" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4" />
      <circle cx="220" cy="180" r="28" stroke="#f43f5e" stroke-width="2.2" />
      <circle cx="220" cy="180" r="8" fill="#f43f5e" filter="url(#glow)" />
    </g>

    <!-- Radiating Data Streams & Nodes -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none">
      <line x1="220" y1="130" x2="220" y2="70" />
      <circle cx="220" cy="70" r="4" fill="#f43f5e" />
      <line x1="270" y1="180" x2="340" y2="180" />
      <circle cx="340" cy="180" r="4" fill="#38bdf8" />
      <line x1="170" y1="180" x2="100" y2="180" />
      <circle cx="100" cy="180" r="4" fill="#38bdf8" />
      <line x1="220" y1="230" x2="220" y2="300" />
      <circle cx="220" cy="300" r="4" fill="#f43f5e" />
    </g>

    <!-- Floating Hex Reticles -->
    <g transform="translate(300, 50)" stroke="#f43f5e" stroke-width="1.5" fill="none" opacity="0.6">
      <polygon points="20,0 40,11 40,34 20,45 0,34 0,11" />
      <circle cx="20" cy="22" r="3" fill="#f43f5e" />
    </g>
    <g transform="translate(60, 220)" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
      <polygon points="16,0 32,9 32,27 16,36 0,27 0,9" />
      <circle cx="16" cy="18" r="2.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Top-Right Neon Slogan (if not built-in to robotics asset) -->
  
  <g opacity="0.9">
    <text x="980" y="52" text-anchor="end" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="none" stroke="#f43f5e" stroke-width="3" letter-spacing="2" opacity="0.3">AUTOMATE THE FUTURE</text>
    <text x="980" y="52" text-anchor="end" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="2" filter="url(#glow)">AUTOMATE THE FUTURE</text>
  </g>
  

  <!-- 3. Cyber Tech Corner Brackets -->
  <g stroke="#f43f5e" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 24 50 L 24 24 L 50 24" />
    <rect x="22" y="22" width="4" height="4" fill="#f43f5e" />
    <path d="M 974 24 L 1000 24 L 1000 50" />
    <rect x="998" y="22" width="4" height="4" fill="#f43f5e" />
    <path d="M 24 336 L 24 362 L 50 362" />
    <rect x="22" y="360" width="4" height="4" fill="#f43f5e" />
    <path d="M 974 362 L 1000 362 L 1000 336" />
    <rect x="998" y="360" width="4" height="4" fill="#f43f5e" />
  </g>

  <!-- 4. Category / Domain Pill Badge -->
  <g transform="translate(42, 38)">
    <rect width="190" height="28" rx="14" fill="#070d1a" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.65" filter="url(#softGlow)" />
    <circle cx="16" cy="14" r="4" fill="#f43f5e" filter="url(#glow)" />
    <text x="28" y="19" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.2">🤖 ROBOTICS &amp; EMBEDDED</text>
  </g>

  <!-- 5. Main Title Typography -->
  <!-- Line 1: Primary Phrase in 3D Metallic Gradient -->
  <g transform="translate(42, 114)">
    <text font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="32" font-weight="900" fill="url(#metallicGrad)" letter-spacing="0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      AUTONOMOUS DRONE ROBOTICS
    </text>
    <g transform="translate(10, -28) scale(0.7)">
      <circle cx="16" cy="16" r="6" fill="#030712" stroke="#f43f5e" stroke-width="2.5" />
      <path d="M16 2 L16 6 M16 26 L16 30 M2 16 L6 16 M26 16 L30 16 M6 6 L9 9 M23 23 L26 26 M6 26 L9 23 M23 9 L26 6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Line 2: Secondary Phrase in Electric Accent Gradient -->
  <g transform="translate(42, 162)">
    <text font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="40" font-weight="900" fill="url(#electricGrad)" letter-spacing="0.5" filter="url(#softGlow)">
      Workshop 2026
    </text>
  </g>

  <!-- 6. Tagline with Divider Bars -->
  <g transform="translate(42, 196)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      Learn | Build | Innovate | Automate
    </text>
  </g>

  <!-- 7. Three Glassmorphic Metadata Cards -->
  <!-- Card 1: Date & Time -->
  <g transform="translate(42, 216)">
    <rect width="144" height="66" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.35" />
    <rect x="0" y="0" width="144" height="66" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Calendar Icon -->
    <g transform="translate(14, 15)" stroke="#f43f5e" stroke-width="1.8" fill="none">
      <rect x="0" y="2" width="16" height="14" rx="2" />
      <line x1="0" y1="6" x2="16" y2="6" />
      <line x1="4" y1="0" x2="4" y2="3" />
      <line x1="12" y1="0" x2="12" y2="3" />
    </g>
    <text x="38" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">DATE &amp; TIME</text>
    <text x="14" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">27 OCT 2026</text>
    <text x="14" y="56" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">08:10 PM - 12:10 AM</text>
  </g>

  <!-- Card 2: Venue -->
  <g transform="translate(196, 216)">
    <rect width="144" height="66" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.35" />
    <rect x="0" y="0" width="144" height="66" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Pin Icon -->
    <g transform="translate(14, 15)" stroke="#f43f5e" stroke-width="1.8" fill="none">
      <path d="M8 1 C4.5 1 1.5 4 1.5 7.5 C1.5 12 8 18 8 18 C8 18 14.5 12 14.5 7.5 C14.5 4 11.5 1 8 1 Z" />
      <circle cx="8" cy="7.5" r="2.5" fill="#f43f5e" />
    </g>
    <text x="38" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">VENUE</text>
    <text x="14" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">Aero Lab 101</text>
    <text x="14" y="56" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">On-Campus / Lab</text>
  </g>

  <!-- Card 3: Organizer -->
  <g transform="translate(350, 216)">
    <rect width="144" height="66" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.35" />
    <rect x="0" y="0" width="144" height="66" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Shield Icon -->
    <g transform="translate(14, 15)" stroke="#f43f5e" stroke-width="1.8" fill="none">
      <path d="M8 1 L15 4 V9 C15 13.5 8 17 8 17 C8 17 1 13.5 1 9 V4 Z" />
      <path d="M5 9 L7 11 L11 7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="38" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">ORGANIZER</text>
    <text x="14" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">EventFlow Verif..</text>
    <text x="14" y="56" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#10b981">Verified Host</text>
  </g>

  <!-- 8. Four Circular Highlight Pills -->
  <g transform="translate(42, 302)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="112" height="26" rx="13" fill="#0b1324" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="11" cy="13" r="3.5" fill="#f43f5e" />
      <text x="21" y="17" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">Hands-on Hardware</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(120, 0)">
      <rect width="114" height="26" rx="13" fill="#0b1324" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="11" cy="13" r="3.5" fill="#f43f5e" />
      <text x="21" y="17" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">Autonomous Pathing</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(242, 0)">
      <rect width="110" height="26" rx="13" fill="#0b1324" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="11" cy="13" r="3.5" fill="#f43f5e" />
      <text x="21" y="17" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">Sensor Telemetry</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(360, 0)">
      <rect width="128" height="26" rx="13" fill="#0b1324" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="11" cy="13" r="3.5" fill="#f43f5e" />
      <text x="21" y="17" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">Arena Challenge</text>
    </g>
  </g>

  <!-- 9. Tech ID Decal -->
  <g opacity="0.65">
    <text x="44" y="356" font-family="'Courier New', monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5">SYS.EVF // SEED-9332 // SPEC-2.0 VECTOR POSTER</text>
    <rect x="380" y="350" width="36" height="4" fill="#f43f5e" opacity="0.5" />
    <rect x="422" y="350" width="12" height="4" fill="#38bdf8" opacity="0.5" />
  </g>
</svg>