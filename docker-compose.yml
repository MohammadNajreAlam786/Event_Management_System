name: event-management-system

services:
  mongo:
    image: mongo:7.0
    container_name: ems-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=event_management_system
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ems-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ems-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ems-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/event_management_system}
      - CLIENT_URL=${CLIENT_URL:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-super_secret_event_management_jwt_key_replace_in_production_1234567890}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-em_token}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - QR_TOKEN_SECRET=${QR_TOKEN_SECRET:-super_secret_qr_token_signing_key_replace_in_production_9876543210}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-20000}
      - AUTO_SEED=${AUTO_SEED:-true}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin@123}
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ems-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ems-network

volumes:
  mongo-data:
    name: ems-mongo-data

networks:
  ems-network:
    name: ems-network
    driver: bridge
