name: event-management-system-dev

services:
  mongo:
    image: mongo:7.0
    container_name: ems-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ems-dev-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ems-ai-service-dev
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
    command: ["uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ems-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/event_management_system
      - CLIENT_URL=http://localhost:5173,http://localhost
      - JWT_SECRET=super_secret_event_management_jwt_key_replace_in_production_1234567890
      - JWT_EXPIRES_IN=1d
      - AUTH_COOKIE_NAME=em_token
      - COOKIE_SECURE=false
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_TIMEOUT_MS=20000
      - AUTO_SEED=true
    command: ["npm", "run", "dev"]
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - ems-dev-network

  frontend:
    image: node:20-alpine
    container_name: ems-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend
    networks:
      - ems-dev-network

volumes:
  mongo-dev-data:
    name: ems-mongo-dev-data

networks:
  ems-dev-network:
    name: ems-dev-network
    driver: bridge
