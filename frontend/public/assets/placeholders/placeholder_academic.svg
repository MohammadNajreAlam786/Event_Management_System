<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 386" width="1024" height="386">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glowOrb" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="386" fill="url(#bgGrad)" />
  <circle cx="750" cy="140" r="320" fill="url(#glowOrb)" />

  <!-- Cyber Tech Reticle & Grid Pattern -->
  <g stroke="#a5b4fc" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="96" x2="1024" y2="96" />
    <line x1="0" y1="192" x2="1024" y2="192" />
    <line x1="0" y1="288" x2="1024" y2="288" />
    <line x1="256" y1="0" x2="256" y2="386" />
    <line x1="512" y1="0" x2="512" y2="386" />
    <line x1="768" y1="0" x2="768" y2="386" />
  </g>

  <!-- Cyber Corner Brackets -->
  <g stroke="#a5b4fc" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 28 52 L 28 28 L 52 28" />
    <rect x="26" y="26" width="4" height="4" fill="#a5b4fc" />
    <path d="M 972 28 L 996 28 L 996 52" />
    <rect x="994" y="26" width="4" height="4" fill="#a5b4fc" />
    <path d="M 28 334 L 28 358 L 52 358" />
    <rect x="26" y="356" width="4" height="4" fill="#a5b4fc" />
    <path d="M 972 358 L 996 358 L 996 334" />
    <rect x="994" y="356" width="4" height="4" fill="#a5b4fc" />
  </g>

  <!-- Large Category Emblem Watermark on Right -->
  <g transform="translate(680, 50) scale(10)" fill="none" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.14">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" />
  </g>

  <!-- Category Badge -->
  <g transform="translate(54, 48)">
    <rect width="190" height="32" rx="16" fill="#070b16" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="18" cy="16" r="4" fill="#a5b4fc" filter="url(#glow)" />
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1.2">📚 RESEARCH FORUM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(54, 150)">
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Academic Forum
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(54, 195)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      Scholarly Discourse | Peer-Reviewed Studies | Rigor
    </text>
  </g>

  <!-- Three Characteristic Attribute Boxes -->
  <g transform="translate(54, 230)">
    <rect width="170" height="62" rx="10" fill="rgba(7, 12, 24, 0.75)" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="16" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="1">CATEGORY</text>
    <text x="16" y="46" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">Academic</text>
  </g>

  <g transform="translate(238, 230)">
    <rect width="170" height="62" rx="10" fill="rgba(7, 12, 24, 0.75)" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="16" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="1">CERTIFICATION</text>
    <text x="16" y="46" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">Verified Credential</text>
  </g>

  <g transform="translate(422, 230)">
    <rect width="170" height="62" rx="10" fill="rgba(7, 12, 24, 0.75)" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="16" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="1">PLATFORM</text>
    <text x="16" y="46" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">EventFlow Verified</text>
  </g>

  <!-- Footer ID code -->
  <text x="54" y="345" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc" opacity="0.75" letter-spacing="1.5">
    EVENTFLOW // OFFICIAL CATEGORY PLACEHOLDER // SPEC-2.0
  </text>
</svg>